services:
  scheduler:
    image: ${APP_IMAGE:?APP_IMAGE must be set to the deployed image}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${DATA_DIR:-/opt/property-hunter/data}:/app/data
    command: scheduler

  ui:
    image: ${APP_IMAGE:?APP_IMAGE must be set to the deployed image}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${DATA_DIR:-/opt/property-hunter/data}:/app/data
    command: ui --port 9000 --host 0.0.0.0
    ports:
      - "127.0.0.1:9000:9000"

  sqlite-web:
    image: ${APP_IMAGE:?APP_IMAGE must be set to the deployed image}
    restart: unless-stopped
    entrypoint: []
    command: ["sqlite_web", "-r", "-H", "0.0.0.0", "-p", "8080", "-q", "/data/property_hunter.db"]
    volumes:
      - ${DATA_DIR:-/opt/property-hunter/data}:/data
    ports:
      - "127.0.0.1:8012:8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - ui
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
