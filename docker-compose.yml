services:
  app:
    build: .
    image: property-hunter:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: scheduler

  sqlite-web:
    build: .
    image: property-hunter:latest
    restart: unless-stopped
    entrypoint: []
    command: ["sqlite_web", "-r", "-H", "0.0.0.0", "-p", "8080", "-q", "/data/property_hunter.db"]
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8012:8080"
