name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test + static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Terraform (for IaC validation)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run test suite
        run: uv run pytest tests -q

      - name: Cloud IaC + shell static checks
        run: scripts/cloud/check.sh
